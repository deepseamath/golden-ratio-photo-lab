<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff7df" />
  <title>황금비 포토 연구소</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;color:#332414;font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,rgba(233,211,255,.8),transparent 32rem),linear-gradient(145deg,#fff9ea 0%,#f5edff 58%,#fff4cf 100%)}button{border:0;font:inherit}.app{width:min(100%,460px);min-height:100vh;margin:0 auto;padding:28px 18px 34px}.brand{display:flex;justify-content:center;margin:12px 0 14px}.badge{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border:1px solid rgba(181,136,37,.36);border-radius:999px;background:rgba(255,252,242,.72);color:#8a6316;font-size:.76rem;font-weight:800}.spark{color:#c89115}h1,h2,p{margin:0}h1{color:#30210d;font-size:clamp(2.1rem,14vw,3.6rem);line-height:1.04;text-align:center;word-break:keep-all}.subtitle{margin-top:10px;color:#6d557d;font-size:1rem;font-weight:700;text-align:center}.upload{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.upload input{display:none}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 14px;border-radius:8px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#d8a420 0%,#ffdf74 58%,#b98316 100%);color:#2d210a;box-shadow:0 12px 28px rgba(142,94,17,.25)}.secondary{border:1px solid rgba(141,103,26,.2);background:rgba(255,252,244,.78);color:#5f4515}.preview,.photocard-wrap,.empty{margin-top:18px}.preview{overflow:hidden;border:1px solid rgba(175,129,32,.22);border-radius:8px;background:rgba(255,253,248,.82);box-shadow:0 20px 40px rgba(91,56,8,.13)}.photo,.pc-photo{position:relative;overflow:hidden;background:#eadfc6}.photo{aspect-ratio:4/5}.photo img,.pc-photo img{display:block;width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;pointer-events:none}.face{position:absolute;left:50%;top:39%;width:min(66%,280px);aspect-ratio:1/1.18;transform:translate(-50%,-50%)}.compact .face{top:38%;width:64%}.rect{position:absolute;border:1.5px solid rgba(255,214,90,.95);box-shadow:0 0 12px rgba(125,79,9,.35)}.a{inset:2% 5% 6% 5%}.b{inset:2% 5% 42% 42%}.c{inset:2% 42% 42% 5%}.d{inset:42% 5% 6% 42%}.spiral{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(72,36,0,.55))}.spiral path{fill:none;stroke:#fff3b0;stroke-width:4;stroke-linecap:round}.mark{position:absolute;min-width:28px;min-height:20px;padding:2px 6px;border-radius:999px;background:rgba(54,36,13,.68);color:#fff0b4;font-size:.68rem;font-weight:800;text-align:center}.top{left:50%;top:-9px;transform:translateX(-50%)}.side{right:-16px;top:48%;transform:rotate(90deg)}.result{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(169,125,29,.18)}.result div{min-height:82px;padding:14px;background:rgba(255,252,244,.92)}.result .wide{grid-column:1/-1}.result span,.metric span{display:block;color:#806b48;font-size:.78rem;font-weight:800}.result strong{display:block;margin-top:6px;color:#30210d;font-size:1.45rem;line-height:1.12;word-break:keep-all}.photocard{overflow:hidden;width:min(100%,360px);margin:0 auto;border:1px solid rgba(181,136,37,.34);border-radius:8px;background:linear-gradient(160deg,#fffaf0,#f1e6ff 60%,#fff0c7);box-shadow:0 22px 48px rgba(79,49,6,.18)}.pc-photo{aspect-ratio:3/4;margin:12px 12px 0;border-radius:6px}.pc-info{padding:14px 16px 16px}.pill{display:inline-flex;align-items:center;max-width:100%;min-height:30px;padding:0 10px;border-radius:999px;background:rgba(255,244,190,.9);color:#7c5310;font-size:.86rem;font-weight:900;word-break:keep-all}.pc-info h2{margin-top:10px;color:#2e2010;font-size:1.24rem;line-height:1.15}.metric{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.metric span{color:#4f3c1b;font-size:.92rem}.stars{display:flex;gap:4px;margin-top:10px;color:#c89115;font-size:1.1rem}.pc-info p{margin-top:12px;color:#6a5574;font-size:.9rem;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.empty{display:grid;gap:14px;justify-items:center;padding:22px 14px;color:#756159;text-align:center}.sample{position:relative;width:min(72vw,260px);aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(181,136,37,.3);border-radius:8px;background:radial-gradient(circle at 50% 35%,#f1d5bd 0 23%,transparent 24%),radial-gradient(circle at 50% 70%,#d8c2f0 0 32%,transparent 33%),linear-gradient(160deg,#fff8e5,#eee2ff)}.empty p{max-width:320px;font-size:.95rem;font-weight:700;line-height:1.55}.hidden{display:none}@media(min-width:720px){.app{width:min(100%,920px);padding-top:36px}h1{font-size:4rem}.preview{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(270px,.8fr)}.result{grid-template-columns:1fr}.result .wide{grid-column:auto}}
  </style>
</head>
<body>
  <main class="app">
    <section>
      <div class="brand"><span class="badge"><span class="spark">✦</span> PHI LAB</span></div>
      <h1>황금비 포토 연구소</h1>
      <p class="subtitle">수학이 발견한 나만의 조화</p>
    </section>
    <section class="upload">
      <input id="upload" type="file" accept="image/*" />
      <input id="camera" type="file" accept="image/*" capture="user" />
      <button class="primary" id="uploadBtn">사진 업로드</button>
      <button class="secondary" id="cameraBtn">촬영하기</button>
    </section>
    <section id="empty" class="empty">
      <div class="sample"><div class="overlay"><div class="face"><div class="rect a"></div><div class="rect b"></div><div class="rect c"></div><div class="rect d"></div><svg class="spiral" viewBox="0 0 220 220" preserveAspectRatio="none"><path d="M 202 202 C 202 134 149 96 104 104 C 55 113 45 166 75 189 C 111 216 158 195 162 153 C 166 114 131 91 96 101 C 65 110 56 143 73 166 C 94 194 134 184 144 151 C 153 119 126 96 97 104" /></svg><span class="mark top">1</span><span class="mark side">1.618</span></div></div></div>
      <p>사진을 선택하면 중앙 얼굴 영역에 황금직사각형과 황금나선이 표시됩니다.</p>
    </section>
    <section id="resultArea" class="hidden">
      <section class="preview">
        <div class="photo"><img id="photo" alt="업로드한 학생 사진" /><div class="overlay"><div class="face"><div class="rect a"></div><div class="rect b"></div><div class="rect c"></div><div class="rect d"></div><svg class="spiral" viewBox="0 0 220 220" preserveAspectRatio="none"><path d="M 202 202 C 202 134 149 96 104 104 C 55 113 45 166 75 189 C 111 216 158 195 162 153 C 166 114 131 91 96 101 C 65 110 56 143 73 166 C 94 194 134 184 144 151 C 153 119 126 96 97 104" /></svg><span class="mark top">1</span><span class="mark side">1.618</span></div></div></div>
        <div class="result"><div><span>황금비 지수</span><strong id="ratio">1.61</strong></div><div><span>황금비 점수</span><strong id="score">95</strong></div><div class="wide"><span>나의 유형</span><strong id="type">조화로운 나선형</strong></div></div>
      </section>
      <section class="photocard-wrap">
        <div class="photocard" id="card"><div class="pc-photo"><img id="cardPhoto" alt="포토카드 학생 사진" /><div class="overlay compact"><div class="face"><div class="rect a"></div><div class="rect b"></div><div class="rect c"></div><div class="rect d"></div><svg class="spiral" viewBox="0 0 220 220" preserveAspectRatio="none"><path d="M 202 202 C 202 134 149 96 104 104 C 55 113 45 166 75 189 C 111 216 158 195 162 153 C 166 114 131 91 96 101 C 65 110 56 143 73 166 C 94 194 134 184 144 151 C 153 119 126 96 97 104" /></svg><span class="mark top">1</span><span class="mark side">1.618</span></div></div></div><div class="pc-info"><span class="pill" id="cardType">조화로운 나선형</span><h2>Golden Ratio Portrait</h2><div class="metric"><span id="cardRatio">PHI 1.61</span><span id="cardScore">95점</span></div><div class="stars" id="stars">★★★★★</div><p>2026 부산수학축전</p></div></div>
        <div class="actions"><button class="secondary" id="resetBtn">다시 선택</button><button class="primary" id="saveBtn">PNG 저장</button></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const types=['조화로운 나선형','피보나치 감성형','황금직사각형형','균형 설계자형','빛나는 대칭형','부드러운 곡선형','비례 탐험가형','감각적 프레임형','수학적 아우라형','우아한 리듬형','정교한 컴퍼스형','미소 방정식형','포토그래픽 균형형','나선 관찰자형','비율 큐레이터형','골든 스튜디오형'];
    const $=id=>document.getElementById(id);let currentUrl='';
    function pick(name=''){const seed=[...name].reduce((s,c)=>s+c.charCodeAt(0),2026);return{ratio:(1.54+(seed%16)/100).toFixed(2),score:Math.min(98,Math.round(82+(seed%17))),type:types[seed%types.length]}}
    function show(file){if(!file)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(file);const r=pick(file.name);$('photo').src=currentUrl;$('cardPhoto').src=currentUrl;$('ratio').textContent=r.ratio;$('score').textContent=r.score;$('type').textContent=r.type;$('cardType').textContent=r.type;$('cardRatio').textContent='PHI '+r.ratio;$('cardScore').textContent=r.score+'점';$('stars').textContent='★★★★★';$('empty').classList.add('hidden');$('resultArea').classList.remove('hidden')}
    $('uploadBtn').onclick=()=>$('upload').click();$('cameraBtn').onclick=()=>$('camera').click();$('upload').onchange=e=>show(e.target.files[0]);$('camera').onchange=e=>show(e.target.files[0]);$('resetBtn').onclick=()=>{if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl='';$('upload').value='';$('camera').value='';$('empty').classList.remove('hidden');$('resultArea').classList.add('hidden')};$('saveBtn').onclick=async()=>{const btn=$('saveBtn');btn.textContent='저장 중';try{const canvas=await html2canvas($('card'),{backgroundColor:null,scale:2,useCORS:true});const a=document.createElement('a');a.download='golden-ratio-photo-card.png';a.href=canvas.toDataURL('image/png');a.click()}finally{btn.textContent='PNG 저장'}};
  </script>
</body>
</html>
