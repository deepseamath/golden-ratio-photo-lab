<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>황금비 포토 연구소</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;color:#2d2418;font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0%,rgba(229,205,255,.82),transparent 28rem),linear-gradient(145deg,#fff9ea 0%,#f7efff 58%,#fff2ca 100%)}button{border:0;font:inherit}h1,h2,h3,p{margin:0}.app{width:min(100%,480px);min-height:100vh;margin:0 auto;padding:26px 16px 34px}.brand{display:flex;justify-content:center;margin:8px 0 12px}.badge{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border:1px solid rgba(181,136,37,.36);border-radius:999px;background:rgba(255,252,242,.72);color:#8a6316;font-size:.76rem;font-weight:850}h1{color:#30210d;font-size:clamp(2.05rem,12vw,3.45rem);line-height:1.04;text-align:center;word-break:keep-all}.subtitle{margin-top:9px;color:#6d557d;font-size:1rem;font-weight:750;text-align:center;word-break:keep-all}.upload,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{margin-top:18px}.upload input{display:none}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 14px;border-radius:8px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#d8a420,#ffdf74 58%,#b98316);color:#2d210a;box-shadow:0 12px 28px rgba(142,94,17,.25)}.secondary{border:1px solid rgba(141,103,26,.2);background:rgba(255,252,244,.8);color:#5f4515}.primary:disabled,.secondary:disabled{opacity:.7;cursor:wait}.notice{margin-top:12px;padding:10px 12px;border:1px solid rgba(129,93,17,.16);border-radius:8px;background:rgba(255,252,244,.72);color:#6c5737;font-size:.86rem;font-weight:700;line-height:1.45}.empty,.analysis,.photocard-wrap{margin-top:18px}.empty{display:grid;gap:14px;justify-items:center;padding:22px 14px;color:#756159;text-align:center}.sample{position:relative;width:min(72vw,260px);aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(181,136,37,.3);border-radius:8px;background:radial-gradient(circle at 50% 35%,#f1d5bd 0 23%,transparent 24%),radial-gradient(circle at 50% 70%,#d8c2f0 0 32%,transparent 33%),linear-gradient(160deg,#fff8e5,#eee2ff)}.empty p{max-width:330px;font-size:.95rem;font-weight:750;line-height:1.55}.preview{overflow:hidden;border:1px solid rgba(175,129,32,.22);border-radius:8px;background:rgba(255,253,248,.88);box-shadow:0 20px 40px rgba(91,56,8,.13)}.photo,.pc-photo{position:relative;overflow:hidden;background:#eadfc6}.photo{aspect-ratio:4/5}.photo img,.pc-photo img{display:block;width:100%;height:100%;object-fit:cover}.guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.status{position:absolute;left:10px;right:10px;bottom:10px;min-height:30px;padding:7px 10px;border-radius:8px;background:rgba(43,31,17,.68);color:#fff2bd;font-size:.78rem;font-weight:850;text-align:center;backdrop-filter:blur(6px)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(169,125,29,.18)}.summary div{min-height:78px;padding:13px;background:rgba(255,252,244,.94)}.summary .wide{grid-column:1/-1}.label{display:block;color:#806b48;font-size:.76rem;font-weight:850}.value{display:block;margin-top:6px;color:#30210d;font-size:1.32rem;font-weight:900;line-height:1.12;word-break:keep-all}.metrics{display:grid;gap:10px;margin-top:12px}.metric-card{padding:13px;border:1px solid rgba(175,129,32,.18);border-radius:8px;background:rgba(255,253,248,.86)}.metric-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.metric-top h3{color:#3f321f;font-size:.92rem;font-weight:900}.metric-top strong{color:#8a6316;font-size:1.08rem;font-weight:950;white-space:nowrap}.meter{height:7px;margin-top:10px;border-radius:999px;background:rgba(113,87,37,.14);overflow:hidden}.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#c99319,#ffe58a)}.metric-card p{margin-top:8px;color:#6f5d45;font-size:.8rem;font-weight:700;line-height:1.42}.photocard{overflow:hidden;width:min(100%,360px);margin:0 auto;border:1px solid rgba(181,136,37,.34);border-radius:8px;background:linear-gradient(160deg,#fffaf0,#f1e6ff 60%,#fff0c7);box-shadow:0 22px 48px rgba(79,49,6,.18)}.pc-photo{aspect-ratio:3/4;margin:12px 12px 0;border-radius:6px}.pc-info{padding:14px 16px 16px}.pill{display:inline-flex;align-items:center;max-width:100%;min-height:30px;padding:0 10px;border-radius:999px;background:rgba(255,244,190,.9);color:#7c5310;font-size:.86rem;font-weight:900;word-break:keep-all}.pc-info h2{margin-top:10px;color:#2e2010;font-size:1.22rem;line-height:1.15}.pc-row{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.pc-row span{color:#4f3c1b;font-size:.9rem;font-weight:850}.stars{margin-top:10px;color:#c89115;font-size:1.08rem}.pc-info p{margin-top:12px;color:#6a5574;font-size:.9rem;font-weight:900}.actions{margin-top:12px}.hidden{display:none}@media(min-width:760px){.app{width:min(100%,980px);padding-top:34px}h1{font-size:3.9rem}.analysis{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:14px;align-items:start}.summary{grid-template-columns:1fr}.summary .wide{grid-column:auto}.metrics{margin-top:0}}
</style>
</head>
<body>
<main class="app">
<section><div class="brand"><span class="badge">✦ FACE RATIO LAB</span></div><h1>황금비 포토 연구소</h1><p class="subtitle">셀피로 확인하는 얼굴 비율과 황금비</p></section>
<section class="upload"><input id="upload" type="file" accept="image/*" /><input id="camera" type="file" accept="image/*" capture="user" /><button class="primary" id="uploadBtn">사진 업로드</button><button class="secondary" id="cameraBtn">촬영하기</button></section>
<p class="notice">사진을 올리면 얼굴 랜드마크를 찾아 얼굴 길이, 얼굴 너비, 눈 사이 거리, 입 너비를 교육용 비율로 계산합니다.</p>
<section id="empty" class="empty"><div class="sample"><canvas class="guide" id="sampleGuide"></canvas></div><p>황금비 가이드는 얼굴 안에 맞춘 정확한 1:1.618 직사각형과 0.618 분할선으로 표시됩니다.</p></section>
<section id="resultArea" class="hidden"><div class="analysis"><section class="preview"><div class="photo" id="photoBox"><img id="photo" alt="분석할 얼굴 사진" /><canvas class="guide" id="guide"></canvas><div class="status" id="status">얼굴 인식 준비 중</div></div><div class="summary"><div><span class="label">황금비 근접 지수</span><strong class="value" id="ratioScore">-</strong></div><div><span class="label">얼굴 길이 ÷ 너비</span><strong class="value" id="faceRatio">-</strong></div><div class="wide"><span class="label">분석 유형</span><strong class="value" id="type">분석 중</strong></div></div></section><section class="metrics" id="metrics"></section></div><section class="photocard-wrap"><div class="photocard" id="card"><div class="pc-photo" id="cardBox"><img id="cardPhoto" alt="포토카드 얼굴 사진" /><canvas class="guide" id="cardGuide"></canvas></div><div class="pc-info"><span class="pill" id="cardType">분석 중</span><h2>Golden Ratio Face Report</h2><div class="pc-row"><span id="cardRatio">Face -</span><span id="cardScore">-점</span></div><div class="stars" id="stars">☆☆☆☆☆</div><p>2026 부산수학축전</p></div></div><div class="actions"><button class="secondary" id="resetBtn">다시 선택</button><button class="primary" id="saveBtn">PNG 저장</button></div></section></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script type="module">
import{FaceLandmarker,FilesetResolver}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/vision_bundle.mjs';
const PHI=1.61803398875,types=['조화로운 나선형','피보나치 감성형','황금직사각형형','균형 설계자형','빛나는 대칭형','부드러운 곡선형','비례 탐험가형','감각적 프레임형','수학적 아우라형','우아한 리듬형','정교한 컴퍼스형','미소 방정식형','포토그래픽 균형형','나선 관찰자형','비율 큐레이터형','골든 스튜디오형'];
const $=id=>document.getElementById(id);let currentUrl='',lastAnalysis=null,landmarkerPromise;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),avg=ps=>ps.reduce((p,c)=>({x:p.x+c.x/ps.length,y:p.y+c.y/ps.length}),{x:0,y:0}),pct=(v,t,r)=>clamp(100-Math.abs(v-t)/r*100,0,100);
async function getLandmarker(){if(!landmarkerPromise){landmarkerPromise=(async()=>{const fileset=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');return FaceLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task',delegate:'CPU'},runningMode:'IMAGE',numFaces:1})})()}return landmarkerPromise}
function build(p,source){const faceLength=dist(p.forehead,p.chin),faceWidth=dist(p.leftCheek,p.rightCheek),eyeDistance=dist(p.leftEye,p.rightEye),mouthWidth=dist(p.mouthL,p.mouthR),noseToMouth=dist(p.nose,p.mouth),eyeToMouth=dist(avg([p.leftEye,p.rightEye]),p.mouth),faceRatio=faceLength/Math.max(.001,faceWidth),mouthEyeRatio=mouthWidth/Math.max(.001,eyeDistance),lowerFaceRatio=eyeToMouth/Math.max(.001,noseToMouth),score=Math.round(pct(faceRatio,PHI,.55)*.52+pct(mouthEyeRatio,PHI,.7)*.26+pct(lowerFaceRatio,PHI,.75)*.22),stars=clamp(Math.round(score/20),1,5),type=types[clamp(Math.round(score/100*15),0,15)];return{source,points:p,faceRatio,mouthEyeRatio,lowerFaceRatio,score,stars,type,measures:[['얼굴 길이',faceLength,'이마 위 기준점부터 턱 끝까지의 세로 거리입니다.',100],['얼굴 너비',faceWidth,'왼쪽 볼과 오른쪽 볼 기준점 사이의 가로 거리입니다.',100],['눈 사이 거리',eyeDistance,'왼쪽 눈 중심과 오른쪽 눈 중심 사이 거리입니다.',clamp(eyeDistance/faceWidth*180,0,100)],['입의 너비',mouthWidth,'입꼬리 왼쪽과 오른쪽 기준점 사이 거리입니다.',clamp(mouthWidth/faceWidth*150,0,100)],['얼굴 길이 ÷ 얼굴 너비',faceRatio,'황금비 1.618과 비교하는 핵심 비율입니다.',pct(faceRatio,PHI,.55)],['입 너비 ÷ 눈 사이 거리',mouthEyeRatio,'입 너비와 눈 사이 거리의 관계를 비교합니다.',pct(mouthEyeRatio,PHI,.7)]]}}
function fallback(){return build({forehead:{x:.5,y:.18},chin:{x:.5,y:.68},leftCheek:{x:.25,y:.42},rightCheek:{x:.75,y:.42},leftEye:{x:.38,y:.36},rightEye:{x:.62,y:.36},nose:{x:.5,y:.47},mouthL:{x:.39,y:.58},mouthR:{x:.61,y:.58},mouth:{x:.5,y:.58}},'fallback')}
function fromLm(lm){return build({forehead:lm[10],chin:lm[152],leftCheek:lm[234],rightCheek:lm[454],leftEye:avg([lm[33],lm[133],lm[159],lm[145]]),rightEye:avg([lm[362],lm[263],lm[386],lm[374]]),nose:lm[1],mouthL:lm[61],mouthR:lm[291],mouth:avg([lm[13],lm[14]])},'face')}
async function analyze(img){try{const lm=await getLandmarker(),r=lm.detect(img);if(r.faceLandmarks?.[0])return fromLm(r.faceLandmarks[0])}catch(e){console.warn(e)}return fallback()}
function map(img,box){const scale=Math.max(box.clientWidth/img.naturalWidth,box.clientHeight/img.naturalHeight),drawW=img.naturalWidth*scale,drawH=img.naturalHeight*scale;return{scale,ox:(box.clientWidth-drawW)/2,oy:(box.clientHeight-drawH)/2}}
function view(p,img,box){const m=map(img,box);return{x:p.x*img.naturalWidth*m.scale+m.ox,y:p.y*img.naturalHeight*m.scale+m.oy}}
function setup(canvas,box){const dpr=Math.max(1,devicePixelRatio||1);canvas.width=Math.round(box.clientWidth*dpr);canvas.height=Math.round(box.clientHeight*dpr);canvas.style.width=box.clientWidth+'px';canvas.style.height=box.clientHeight+'px';const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,box.clientWidth,box.clientHeight);return ctx}
function label(ctx,x,y,text,align='center'){ctx.font='750 10px sans-serif';const w=Math.max(58,ctx.measureText(text).width+14),bx=align==='left'?x:align==='right'?x-w:x-w/2;ctx.fillStyle='rgba(48,33,13,.78)';ctx.strokeStyle='rgba(255,244,190,.85)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,y-12,w,20,5);ctx.fill();ctx.stroke();ctx.fillStyle='#fff1b7';ctx.textAlign=align==='left'?'left':align==='right'?'right':'center';ctx.textBaseline='middle';ctx.fillText(text,align==='left'?bx+7:align==='right'?bx+w-7:x,y-2)}
function line(ctx,a,b,text,color='rgba(255,230,128,.96)',off=-10){ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();label(ctx,(a.x+b.x)/2,(a.y+b.y)/2+off,text)}
function point(ctx,p){ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fillStyle='rgba(255,222,92,.95)';ctx.fill();ctx.strokeStyle='rgba(65,40,5,.6)';ctx.lineWidth=1;ctx.stroke()}
function golden(ctx,r){const{x,y,w,h}=r,v1=x+w/PHI,v2=x+w-w/PHI,h1=y+h/PHI,h2=y+h-h/PHI;ctx.save();ctx.strokeStyle='rgba(255,211,83,.96)';ctx.lineWidth=2;ctx.shadowColor='rgba(55,35,5,.35)';ctx.shadowBlur=3;ctx.strokeRect(x,y,w,h);ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,239,175,.86)';ctx.lineWidth=1.25;ctx.setLineDash([7,5]);[[v1,y,v1,y+h],[v2,y,v2,y+h],[x,h1,x+w,h1],[x,h2,x+w,h2]].forEach(l=>{ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(l[2],l[3]);ctx.stroke()});ctx.setLineDash([]);ctx.strokeStyle='rgba(255,229,133,.72)';ctx.lineWidth=1.1;const s=Math.min(w,h);ctx.strokeRect(x,y+(h-s)/2,s,s);ctx.strokeRect(x+w-s/PHI,y+(h-s/PHI)/2,s/PHI,s/PHI);label(ctx,x+w/2,y-10,'황금직사각형 1 : 1.618');label(ctx,x+w+4,y+h/2,'0.618','left');ctx.restore()}
function draw(canvasId,imgId,boxId,a){const img=$(imgId),box=$(boxId),canvas=$(canvasId);if(!img.complete||!img.naturalWidth||!box.clientWidth)return;const ctx=setup(canvas,box),p=Object.fromEntries(Object.entries(a.points).map(([k,v])=>[k,view(v,img,box)])),cx=(p.leftCheek.x+p.rightCheek.x)/2,cy=(p.forehead.y+p.chin.y)/2,rx=Math.abs(p.rightCheek.x-p.leftCheek.x)*.58,ry=Math.abs(p.chin.y-p.forehead.y)*.58,rectH=Math.min(ry*1.9,box.clientHeight*.72),rectW=rectH/PHI,rect={x:cx-rectW/2,y:cy-rectH/2,w:rectW,h:rectH};ctx.fillStyle='rgba(255,222,112,.025)';ctx.fillRect(rect.x,rect.y,rect.w,rect.h);golden(ctx,rect);ctx.strokeStyle='rgba(198,145,28,.78)';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();line(ctx,p.forehead,p.chin,'얼굴 길이','rgba(255,242,185,.92)',-16);line(ctx,p.leftCheek,p.rightCheek,'얼굴 너비','rgba(255,242,185,.92)',18);line(ctx,p.leftEye,p.rightEye,'눈 사이','rgba(187,227,255,.92)',-12);line(ctx,p.mouthL,p.mouthR,'입 너비','rgba(228,205,255,.94)',16);[p.forehead,p.chin,p.leftCheek,p.rightCheek,p.leftEye,p.rightEye,p.mouthL,p.mouthR].forEach(pt=>point(ctx,pt))}
function render(a){$('ratioScore').textContent=a.score+'점';$('faceRatio').textContent=a.faceRatio.toFixed(2);$('type').textContent=a.type;$('cardType').textContent=a.type;$('cardRatio').textContent='Face '+a.faceRatio.toFixed(2);$('cardScore').textContent=a.score+'점';$('stars').textContent='★★★★★'.slice(0,a.stars)+'☆☆☆☆☆'.slice(0,5-a.stars);$('status').textContent=a.source==='face'?'얼굴 인식 완료: 황금비 기준선을 정확한 직사각형으로 맞췄어요':'얼굴 인식이 어려워 예비 기준점으로 표시했어요';$('metrics').innerHTML=a.measures.map(m=>`<article class="metric-card"><div class="metric-top"><h3>${m[0]}</h3><strong>${m[1].toFixed(m[0].includes('÷')?2:3)}</strong></div><div class="meter"><div class="bar" style="width:${clamp(m[3],8,100)}%"></div></div><p>${m[2]}</p></article>`).join('')}
async function show(file){if(!file)return;if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl=URL.createObjectURL(file);$('photo').src=currentUrl;$('cardPhoto').src=currentUrl;$('empty').classList.add('hidden');$('resultArea').classList.remove('hidden');$('status').textContent='얼굴 인식 및 비율 계산 중...';$('uploadBtn').disabled=$('cameraBtn').disabled=true;const probe=new Image();probe.src=currentUrl;await probe.decode().catch(()=>{});lastAnalysis=await analyze(probe);render(lastAnalysis);await $('photo').decode().catch(()=>{});await $('cardPhoto').decode().catch(()=>{});draw('guide','photo','photoBox',lastAnalysis);draw('cardGuide','cardPhoto','cardBox',lastAnalysis);$('uploadBtn').disabled=$('cameraBtn').disabled=false}
function reset(){if(currentUrl)URL.revokeObjectURL(currentUrl);currentUrl='';lastAnalysis=null;$('upload').value='';$('camera').value='';$('empty').classList.remove('hidden');$('resultArea').classList.add('hidden')}
function sample(){const c=$('sampleGuide'),b=c.parentElement,ctx=setup(c,b),r={x:b.clientWidth*.31,y:b.clientHeight*.17,w:b.clientWidth*.38,h:b.clientWidth*.38*PHI};golden(ctx,r);line(ctx,{x:b.clientWidth*.5,y:b.clientHeight*.18},{x:b.clientWidth*.5,y:b.clientHeight*.68},'길이');line(ctx,{x:b.clientWidth*.25,y:b.clientHeight*.43},{x:b.clientWidth*.75,y:b.clientHeight*.43},'너비','rgba(255,242,185,.92)',18)}
$('uploadBtn').onclick=()=>$('upload').click();$('cameraBtn').onclick=()=>$('camera').click();$('upload').onchange=e=>show(e.target.files[0]);$('camera').onchange=e=>show(e.target.files[0]);$('resetBtn').onclick=reset;$('saveBtn').onclick=async()=>{const btn=$('saveBtn');btn.textContent='저장 중';try{if(lastAnalysis)draw('cardGuide','cardPhoto','cardBox',lastAnalysis);const canvas=await html2canvas($('card'),{backgroundColor:null,scale:2,useCORS:true});const a=document.createElement('a');a.download='golden-ratio-face-report.png';a.href=canvas.toDataURL('image/png');a.click()}finally{btn.textContent='PNG 저장'}};addEventListener('resize',()=>{sample();if(lastAnalysis){draw('guide','photo','photoBox',lastAnalysis);draw('cardGuide','cardPhoto','cardBox',lastAnalysis)}});sample();
</script>
</body>
</html>
