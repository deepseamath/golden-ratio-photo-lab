<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff7df" />
  <title>황금비 포토 연구소</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;color:#332414;font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,rgba(233,211,255,.78),transparent 30rem),linear-gradient(145deg,#fff9ea 0%,#f7efff 58%,#fff3ca 100%)}button{border:0;font:inherit}.app{width:min(100%,460px);min-height:100vh;margin:0 auto;padding:28px 18px 34px}.brand{display:flex;justify-content:center;margin:12px 0 14px}.badge{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border:1px solid rgba(181,136,37,.36);border-radius:999px;background:rgba(255,252,242,.72);color:#8a6316;font-size:.76rem;font-weight:800}.spark{color:#c89115}h1,h2,p{margin:0}h1{color:#30210d;font-size:clamp(2.08rem,13vw,3.45rem);line-height:1.04;text-align:center;word-break:keep-all}.subtitle{margin-top:10px;color:#6d557d;font-size:1rem;font-weight:700;text-align:center}.upload{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.upload input{display:none}.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 14px;border-radius:8px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#d8a420 0%,#ffdf74 58%,#b98316 100%);color:#2d210a;box-shadow:0 12px 28px rgba(142,94,17,.25)}.secondary{border:1px solid rgba(141,103,26,.2);background:rgba(255,252,244,.78);color:#5f4515}.primary:disabled{opacity:.7;cursor:wait}.preview,.photocard-wrap,.empty{margin-top:18px}.preview{overflow:hidden;border:1px solid rgba(175,129,32,.22);border-radius:8px;background:rgba(255,253,248,.86);box-shadow:0 20px 40px rgba(91,56,8,.13)}.photo,.pc-photo{position:relative;overflow:hidden;background:#eadfc6}.photo{aspect-ratio:4/5}.photo img,.pc-photo img{display:block;width:100%;height:100%;object-fit:cover}.guide-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.status{position:absolute;left:10px;right:10px;bottom:10px;min-height:30px;padding:7px 10px;border-radius:8px;background:rgba(43,31,17,.68);color:#fff2bd;font-size:.78rem;font-weight:800;text-align:center;backdrop-filter:blur(6px)}.result{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(169,125,29,.18)}.result div{min-height:82px;padding:14px;background:rgba(255,252,244,.92)}.result .wide{grid-column:1/-1}.result span,.metric span{display:block;color:#806b48;font-size:.78rem;font-weight:800}.result strong{display:block;margin-top:6px;color:#30210d;font-size:1.42rem;line-height:1.12;word-break:keep-all}.photocard{overflow:hidden;width:min(100%,360px);margin:0 auto;border:1px solid rgba(181,136,37,.34);border-radius:8px;background:linear-gradient(160deg,#fffaf0,#f1e6ff 60%,#fff0c7);box-shadow:0 22px 48px rgba(79,49,6,.18)}.pc-photo{aspect-ratio:3/4;margin:12px 12px 0;border-radius:6px}.pc-info{padding:14px 16px 16px}.pill{display:inline-flex;align-items:center;max-width:100%;min-height:30px;padding:0 10px;border-radius:999px;background:rgba(255,244,190,.9);color:#7c5310;font-size:.86rem;font-weight:900;word-break:keep-all}.pc-info h2{margin-top:10px;color:#2e2010;font-size:1.22rem;line-height:1.15}.metric{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.metric span{color:#4f3c1b;font-size:.92rem}.stars{display:flex;gap:4px;margin-top:10px;color:#c89115;font-size:1.08rem}.pc-info p{margin-top:12px;color:#6a5574;font-size:.9rem;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.empty{display:grid;gap:14px;justify-items:center;padding:22px 14px;color:#756159;text-align:center}.sample{position:relative;width:min(72vw,260px);aspect-ratio:4/5;overflow:hidden;border:1px solid rgba(181,136,37,.3);border-radius:8px;background:radial-gradient(circle at 50% 35%,#f1d5bd 0 23%,transparent 24%),radial-gradient(circle at 50% 70%,#d8c2f0 0 32%,transparent 33%),linear-gradient(160deg,#fff8e5,#eee2ff)}.empty p{max-width:320px;font-size:.95rem;font-weight:700;line-height:1.55}.hidden{display:none}@media(min-width:720px){.app{width:min(100%,920px);padding-top:36px}h1{font-size:3.9rem}.preview{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(270px,.8fr)}.result{grid-template-columns:1fr}.result .wide{grid-column:auto}}
  </style>
</head>
<body>
  <main class="app">
    <section>
      <div class="brand"><span class="badge"><span class="spark">✦</span> PHI LAB</span></div>
      <h1>황금비 포토 연구소</h1>
      <p class="subtitle">수학이 발견한 나만의 조화</p>
    </section>

    <section class="upload">
      <input id="upload" type="file" accept="image/*" />
      <input id="camera" type="file" accept="image/*" capture="user" />
      <button class="primary" id="uploadBtn">사진 업로드</button>
      <button class="secondary" id="cameraBtn">촬영하기</button>
    </section>

    <section id="empty" class="empty">
      <div class="sample"><canvas class="guide-canvas" id="sampleGuide"></canvas></div>
      <p>사진을 선택하면 얼굴을 먼저 찾고, 얼굴 안에서만 황금비 가이드를 표시합니다.</p>
    </section>

    <section id="resultArea" class="hidden">
      <section class="preview">
        <div class="photo" id="photoBox">
          <img id="photo" alt="업로드한 학생 사진" />
          <canvas class="guide-canvas" id="guide"></canvas>
          <div class="status" id="status">얼굴 인식 준비 중</div>
        </div>
        <div class="result">
          <div><span>황금비 지수</span><strong id="ratio">-</strong></div>
          <div><span>황금비 점수</span><strong id="score">-</strong></div>
          <div class="wide"><span>나의 유형</span><strong id="type">분석 중</strong></div>
        </div>
      </section>

      <section class="photocard-wrap">
        <div class="photocard" id="card">
          <div class="pc-photo" id="cardBox">
            <img id="cardPhoto" alt="포토카드 학생 사진" />
            <canvas class="guide-canvas" id="cardGuide"></canvas>
          </div>
          <div class="pc-info">
            <span class="pill" id="cardType">분석 중</span>
            <h2>Golden Ratio Portrait</h2>
            <div class="metric"><span id="cardRatio">PHI -</span><span id="cardScore">-점</span></div>
            <div class="stars" id="stars">☆☆☆☆☆</div>
            <p>2026 부산수학축전</p>
          </div>
        </div>
        <div class="actions"><button class="secondary" id="resetBtn">다시 선택</button><button class="primary" id="saveBtn">PNG 저장</button></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/vision_bundle.mjs';

    const PHI = 1.61803398875;
    const typeNames = ['조화로운 나선형','피보나치 감성형','황금직사각형형','균형 설계자형','빛나는 대칭형','부드러운 곡선형','비례 탐험가형','감각적 프레임형','수학적 아우라형','우아한 리듬형','정교한 컴퍼스형','미소 방정식형','포토그래픽 균형형','나선 관찰자형','비율 큐레이터형','골든 스튜디오형'];
    const $ = (id) => document.getElementById(id);
    let currentUrl = '';
    let landmarkerPromise;
    let lastAnalysis = null;

    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function avg(points) { return points.reduce((p, c) => ({ x: p.x + c.x / points.length, y: p.y + c.y / points.length }), { x: 0, y: 0 }); }

    async function getLandmarker() {
      if (!landmarkerPromise) {
        landmarkerPromise = (async () => {
          const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');
          return FaceLandmarker.createFromOptions(fileset, {
            baseOptions: {
              modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task',
              delegate: 'GPU'
            },
            runningMode: 'IMAGE',
            numFaces: 1,
            outputFaceBlendshapes: false,
            outputFacialTransformationMatrixes: false
          });
        })();
      }
      return landmarkerPromise;
    }

    function imageMap(img, box) {
      const scale = Math.max(box.clientWidth / img.naturalWidth, box.clientHeight / img.naturalHeight);
      const drawW = img.naturalWidth * scale;
      const drawH = img.naturalHeight * scale;
      return { scale, ox: (box.clientWidth - drawW) / 2, oy: (box.clientHeight - drawH) / 2 };
    }

    function toViewPoint(p, img, box) {
      const m = imageMap(img, box);
      return { x: p.x * img.naturalWidth * m.scale + m.ox, y: p.y * img.naturalHeight * m.scale + m.oy };
    }

    function fallbackFace(img) {
      return {
        source: 'fallback',
        bounds: { x: 0.23, y: 0.12, w: 0.54, h: 0.48 },
        landmarks: null,
        ratio: 1.61,
        score: 78,
        type: '중앙 기준 예비 분석형',
        stars: 4
      };
    }

    function analyzeLandmarks(landmarks) {
      const xs = landmarks.map((p) => p.x);
      const ys = landmarks.map((p) => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const rawW = maxX - minX;
      const rawH = maxY - minY;
      const bounds = {
        x: clamp(minX - rawW * 0.10, 0, 1),
        y: clamp(minY - rawH * 0.08, 0, 1),
        w: clamp(rawW * 1.20, 0.1, 1),
        h: clamp(rawH * 1.16, 0.1, 1)
      };

      const leftEye = avg([landmarks[33], landmarks[133], landmarks[159], landmarks[145]]);
      const rightEye = avg([landmarks[362], landmarks[263], landmarks[386], landmarks[374]]);
      const nose = landmarks[1];
      const chin = landmarks[152];
      const forehead = landmarks[10];
      const mouth = avg([landmarks[13], landmarks[14], landmarks[61], landmarks[291]]);
      const center = avg([leftEye, rightEye]);
      const faceRatio = bounds.h / bounds.w;
      const upper = Math.max(0.001, dist(forehead, nose));
      const lower = Math.max(0.001, dist(nose, chin));
      const verticalRatio = lower / upper;
      const eyeSpan = dist(leftEye, rightEye);
      const noseToMouth = dist(nose, mouth);
      const harmonyRatio = eyeSpan / Math.max(0.001, noseToMouth);
      const symmetry = 1 - clamp(Math.abs(dist(leftEye, nose) - dist(rightEye, nose)) / Math.max(0.001, eyeSpan), 0, 1);
      const ratioIndex = (faceRatio * 0.42 + verticalRatio * 0.38 + harmonyRatio * 0.20);
      const ratioScore = 1 - clamp(Math.abs(ratioIndex - PHI) / 0.62, 0, 1);
      const score = Math.round(64 + ratioScore * 24 + symmetry * 10);
      const typeIndex = clamp(Math.round((score - 64) / 34 * 15), 0, 15);

      return {
        source: 'face',
        bounds,
        landmarks: { leftEye, rightEye, nose, chin, forehead, mouth, center },
        ratio: Number(ratioIndex.toFixed(2)),
        score,
        type: typeNames[typeIndex],
        stars: clamp(Math.round(score / 20), 3, 5)
      };
    }

    async function analyzeFace(img) {
      try {
        const landmarker = await getLandmarker();
        const result = landmarker.detect(img);
        if (result.faceLandmarks && result.faceLandmarks[0]) return analyzeLandmarks(result.faceLandmarks[0]);
      } catch (error) {
        console.warn('Face detection failed:', error);
      }
      return fallbackFace(img);
    }

    function setupCanvas(canvas, box) {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.round(box.clientWidth * dpr);
      canvas.height = Math.round(box.clientHeight * dpr);
      canvas.style.width = box.clientWidth + 'px';
      canvas.style.height = box.clientHeight + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, box.clientWidth, box.clientHeight);
      return ctx;
    }

    function boundsToView(analysis, img, box) {
      const m = imageMap(img, box);
      const b = analysis.bounds;
      return {
        x: b.x * img.naturalWidth * m.scale + m.ox,
        y: b.y * img.naturalHeight * m.scale + m.oy,
        w: b.w * img.naturalWidth * m.scale,
        h: b.h * img.naturalHeight * m.scale
      };
    }

    function drawGoldenSpiral(ctx, b) {
      const cx = b.x + b.w * 0.50;
      const cy = b.y + b.h * 0.48;
      const maxR = Math.min(b.w, b.h) * 0.42;
      ctx.beginPath();
      for (let t = 0; t <= 2.9 * Math.PI; t += 0.045) {
        const r = maxR * Math.exp(-0.185 * t);
        const x = cx + Math.cos(t - 0.45) * r;
        const y = cy + Math.sin(t - 0.45) * r * 0.88;
        if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(255, 239, 168, 0.92)';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function drawGuides(canvasId, imgId, boxId, analysis, compact = false) {
      const img = $(imgId);
      const box = $(boxId);
      const canvas = $(canvasId);
      if (!img.complete || !img.naturalWidth || !box.clientWidth) return;
      const ctx = setupCanvas(canvas, box);
      const b = boundsToView(analysis, img, box);
      const pad = compact ? 0.05 : 0.035;
      const face = { x: b.x + b.w * pad, y: b.y + b.h * pad, w: b.w * (1 - pad * 2), h: b.h * (1 - pad * 2) };

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(face.x + face.w / 2, face.y + face.h / 2, face.w * 0.43, face.h * 0.49, 0, 0, Math.PI * 2);
      ctx.clip();

      ctx.fillStyle = 'rgba(255, 222, 112, 0.035)';
      ctx.fillRect(face.x, face.y, face.w, face.h);
      ctx.strokeStyle = 'rgba(255, 214, 90, 0.72)';
      ctx.lineWidth = compact ? 1.3 : 1.6;
      ctx.strokeRect(face.x + face.w * 0.14, face.y + face.h * 0.07, face.w * 0.72, face.h * 0.86);

      const gx1 = face.x + face.w / PHI;
      const gx2 = face.x + face.w - face.w / PHI;
      const gy1 = face.y + face.h / PHI;
      const gy2 = face.y + face.h - face.h / PHI;
      ctx.setLineDash([5, 6]);
      ctx.strokeStyle = 'rgba(255, 238, 172, 0.58)';
      [[gx1, face.y, gx1, face.y + face.h], [gx2, face.y, gx2, face.y + face.h], [face.x, gy1, face.x + face.w, gy1], [face.x, gy2, face.x + face.w, gy2]].forEach((l) => { ctx.beginPath(); ctx.moveTo(l[0], l[1]); ctx.lineTo(l[2], l[3]); ctx.stroke(); });
      ctx.setLineDash([]);

      drawGoldenSpiral(ctx, face);

      if (analysis.landmarks) {
        const pts = analysis.landmarks;
        const eyeL = toViewPoint(pts.leftEye, img, box);
        const eyeR = toViewPoint(pts.rightEye, img, box);
        const nose = toViewPoint(pts.nose, img, box);
        const mouth = toViewPoint(pts.mouth, img, box);
        ctx.strokeStyle = 'rgba(255, 249, 207, 0.82)';
        ctx.lineWidth = compact ? 1.2 : 1.5;
        ctx.beginPath(); ctx.moveTo(eyeL.x, eyeL.y); ctx.lineTo(eyeR.x, eyeR.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(nose.x, nose.y - 6); ctx.lineTo(nose.x, mouth.y + 5); ctx.stroke();
        [eyeL, eyeR, nose, mouth].forEach((p) => { ctx.beginPath(); ctx.arc(p.x, p.y, compact ? 2.1 : 2.6, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 226, 105, 0.9)'; ctx.fill(); });
      }
      ctx.restore();

      ctx.strokeStyle = 'rgba(198, 145, 28, 0.88)';
      ctx.lineWidth = compact ? 1.2 : 1.5;
      ctx.beginPath();
      ctx.ellipse(face.x + face.w / 2, face.y + face.h / 2, face.w * 0.43, face.h * 0.49, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    function updateResult(analysis) {
      $('ratio').textContent = analysis.ratio.toFixed(2);
      $('score').textContent = analysis.score;
      $('type').textContent = analysis.type;
      $('cardType').textContent = analysis.type;
      $('cardRatio').textContent = 'PHI ' + analysis.ratio.toFixed(2);
      $('cardScore').textContent = analysis.score + '점';
      $('stars').textContent = '★★★★★'.slice(0, analysis.stars) + '☆☆☆☆☆'.slice(0, 5 - analysis.stars);
      $('status').textContent = analysis.source === 'face' ? '얼굴 인식 완료: 얼굴 안쪽 기준으로 황금비를 표시했어요' : '얼굴 인식이 어려워 중앙 얼굴 영역 기준으로 표시했어요';
    }

    async function show(file) {
      if (!file) return;
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(file);
      $('photo').src = currentUrl;
      $('cardPhoto').src = currentUrl;
      $('empty').classList.add('hidden');
      $('resultArea').classList.remove('hidden');
      $('status').textContent = '얼굴 인식 중...';
      $('uploadBtn').disabled = true;
      $('cameraBtn').disabled = true;

      await Promise.all([
        $('photo').decode().catch(() => {}),
        $('cardPhoto').decode().catch(() => {})
      ]);

      lastAnalysis = await analyzeFace($('photo'));
      updateResult(lastAnalysis);
      drawGuides('guide', 'photo', 'photoBox', lastAnalysis, false);
      drawGuides('cardGuide', 'cardPhoto', 'cardBox', lastAnalysis, true);
      $('uploadBtn').disabled = false;
      $('cameraBtn').disabled = false;
    }

    function reset() {
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = '';
      lastAnalysis = null;
      $('upload').value = '';
      $('camera').value = '';
      $('empty').classList.remove('hidden');
      $('resultArea').classList.add('hidden');
    }

    function drawSample() {
      const canvas = $('sampleGuide');
      const box = canvas.parentElement;
      const ctx = setupCanvas(canvas, box);
      const face = { x: box.clientWidth * 0.22, y: box.clientHeight * 0.12, w: box.clientWidth * 0.56, h: box.clientHeight * 0.55 };
      ctx.strokeStyle = 'rgba(198,145,28,.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(face.x + face.w / 2, face.y + face.h / 2, face.w * 0.43, face.h * 0.49, 0, 0, Math.PI * 2);
      ctx.stroke();
      drawGoldenSpiral(ctx, face);
    }

    $('uploadBtn').onclick = () => $('upload').click();
    $('cameraBtn').onclick = () => $('camera').click();
    $('upload').onchange = (e) => show(e.target.files[0]);
    $('camera').onchange = (e) => show(e.target.files[0]);
    $('resetBtn').onclick = reset;
    $('saveBtn').onclick = async () => {
      const btn = $('saveBtn');
      btn.textContent = '저장 중';
      try {
        if (lastAnalysis) drawGuides('cardGuide', 'cardPhoto', 'cardBox', lastAnalysis, true);
        const canvas = await html2canvas($('card'), { backgroundColor: null, scale: 2, useCORS: true });
        const a = document.createElement('a');
        a.download = 'golden-ratio-photo-card.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      } finally {
        btn.textContent = 'PNG 저장';
      }
    };

    window.addEventListener('resize', () => {
      drawSample();
      if (lastAnalysis) {
        drawGuides('guide', 'photo', 'photoBox', lastAnalysis, false);
        drawGuides('cardGuide', 'cardPhoto', 'cardBox', lastAnalysis, true);
      }
    });
    drawSample();
  </script>
</body>
</html>
